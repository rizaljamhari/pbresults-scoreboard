name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Windows portable package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$env:RELEASE_TAG' must use stable semantic version format vMAJOR.MINOR.PATCH."
          }

          & git fetch --no-tags origin 'main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch origin/main for release validation.'
          }
          $releaseCommit = (& git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $releaseCommit) {
            throw "Unable to resolve release tag '$env:RELEASE_TAG' to a commit."
          }
          & git merge-base --is-ancestor $releaseCommit 'refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:RELEASE_TAG' does not point to a commit on main."
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run client TypeScript check
        run: pnpm exec tsc -p tsconfig.json --pretty false

      - name: Check overlay CSS scope
        run: pnpm check:overlay-scope

      - name: Build portable package
        run: pnpm package:windows:portable
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Validate update release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem 'release/windows-portable/*.zip' -File)
          $manifests = @(Get-ChildItem 'release/windows-portable/*-update-manifest-*.json' -File)
          if ($zips.Count -ne 1 -or $manifests.Count -ne 1) {
            throw "Expected one ZIP and one update manifest; found $($zips.Count) ZIP(s) and $($manifests.Count) manifest(s)."
          }
          $manifest = Get-Content $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($manifest.asset.name -ne $zips[0].Name) { throw 'Manifest asset filename does not match the ZIP.' }
          if ([int64]$manifest.asset.size -ne $zips[0].Length) { throw 'Manifest asset size does not match the ZIP.' }
          $digest = (Get-FileHash $zips[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.asset.sha256 -ne $digest) { throw 'Manifest SHA-256 does not match the ZIP.' }
          if ('v' + $manifest.release.version -ne $manifest.release.tag) { throw 'Manifest release tag and version disagree.' }
          if ('${{ github.ref_type }}' -eq 'tag' -and $manifest.release.tag -ne '${{ github.ref_name }}') {
            throw 'Manifest release tag does not match the Git tag.'
          }

      - name: Upload portable release assets
        uses: actions/upload-artifact@v4
        with:
          name: pbresults-scoreboard-windows-portable
          path: |
            release/windows-portable/*.zip
            release/windows-portable/*-update-manifest-*.json
          if-no-files-found: error

      - name: Create GitHub release and attach portable zip
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            Get-ChildItem 'release/windows-portable/*.zip' -File
            Get-ChildItem 'release/windows-portable/*-update-manifest-*.json' -File
          )
          if ($assets.Count -ne 2) {
            throw "Expected exactly one portable ZIP and one manifest, found $($assets.Count) assets."
          }

          $releaseJson = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $isDraft = ($releaseJson | ConvertFrom-Json).isDraft
          } else {
            & gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --draft `
              --title $env:RELEASE_TAG `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release $env:RELEASE_TAG."
            }
            $isDraft = $true
          }

          & gh release upload $env:RELEASE_TAG $assets[0].FullName $assets[1].FullName `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the portable zip to release $env:RELEASE_TAG."
          }

          if ($isDraft) {
            & gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --draft=false `
              --latest
            if ($LASTEXITCODE -ne 0) {
              throw "The asset was uploaded, but release $env:RELEASE_TAG could not be published."
            }
          }
